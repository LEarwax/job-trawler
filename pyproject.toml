[project]
name = "job-trawler"
version = "0.1.0"
description = "Trawls fresh job postings across configurable lanes and puts them on a Notion board"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "python-jobspy>=1.4",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
trawl = "job_trawler.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_trawler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
